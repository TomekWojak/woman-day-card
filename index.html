<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
</head>

<body
    class="flex justify-center flex-col items-center bg-linear-to-br from-[#2b000e] via-[#3d0014] to-[#5c001a] w-full min-h-screen">
    <div class="terminal relative h-60 sm:h-80 md:h-120 border border-[rgba(255,100,130,0.25)] w-[95%] max-w-220 bg-[#140007]/90 backdrop-blur-sm rounded-lg
text-[#ffd6e0] shadow-[rgba(255, 60, 100, 0.15)] shadow-lg
">
        <div class="terminal-top rounded-tl-lg rounded-tr-lg font-hacker relative flex items-center gap-1.5 px-2 md:px-4 h-[20%] max-h-10 w-full bg-[#1a0008] border-b border-[rgba(255,100,130,0.25)]

">
            <div class="dot-corner dot-red w-3 aspect-square rounded-full bg-[#ff4d6d]"></div>
            <div class="dot-corner dot-yellow w-3 aspect-square rounded-full bg-[#ff8fab]"></div>
            <div class="dot-corner dot-green w-3 aspect-square rounded-full bg-[#ffb3c1]"></div>
            <p class="text-center text-xs md:text-sm w-full absolute left-0 top-1/2 -translate-y-1/2">Wyjątkowy terminal
            </p>
        </div>
        <div
            class="terminal-body h-[80%] flex flex-col items-start gap-2 text-[0.9rem] md:text-[1rem] lg:text-[1.15rem] overflow-y-auto font-hacker p-2 md:p-4">
            <p class="static-text"> Witaj
                użytkowniczko, miło Cię widzieć 🌸
            </p>
            <p class="static-text"> Wpisz <span class="accent text-[#ff4d6d] font-semibold">start</span>, aby
                rozpocząć
            </p>
            <div class="input-box flex justify-between items-center gap-2 w-full">
                <p class="pointer-events-none select-none md:text-lg">></p> <input autocomplete="off"
                    autocapitalize="off" spellcheck="false" type="text" id="entry"
                    class="active entry w-full h-6 caret-[#ff4d6d] focus-visible:outline-0 outline-0 font-hacker select-none">
            </div>

        </div>
        <img src="./rose-svgrepo-com.svg"
            class="rose scale-0 pointer-events-none select-none absolute w-20 left-1/2 -bottom-40 -translate-x-1/2 sm:left-[unset] sm:right-0 sm:-bottom-10 sm:translate-0 md:w-25 md:-right-10 transition-transform duration-1000"
            alt="">
    </div>

    <button id="send-btn"
        class="bg-linear-90 from-[#ff4d6d] to-[#ff8fab] text-white mt-3 px-2 py-1 font-hacker w-[50%] rounded-lg shadow-[0_0_10px_rgba(255,77,109,0.6),inset_0_0_6px_rgba(255,255,255,0.15)] active:scale-90 transition-transform duration-500">Zatwierdź</button>

    <audio id="clickSound" src="./emotional-and-memorable-piano-music.mp3"></audio>
    <canvas id="canvas"></canvas>
    <div class="flex opacity-0 pointer-events-none select-none transition-opacity duration-1000 img-box w-[80%] text-center max-w-100 bg-[#1a000f] p-5 flex-col items-center border border-[#ff4d6d]/30
 absolute left-1/2 top-1/2 -translate-1/2 shadow-[0_0_20px_rgba(255,77,109,0.05)]
text-[#ffd6e0] rounded-xl
">
        <h1 class="font-hacker mb-5 text-sm sm:text-lg">Wszystkiego najlepszego z okazji Dnia Kobiet! 💐🌸💕</h1>
        <img src="./1771457846912.jpg" class="brightness-90 rounded-xl w-full" alt="">
    </div>
</body>

</html>
